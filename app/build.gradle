plugins {
    id 'com.android.application'
}
android {
    namespace 'com.mutfakajans.sos'
    compileSdk 35
    defaultConfig {
        // Fresh package ID avoids conflicts with any previously installed SOS build.
        applicationId 'com.mutfakajans.sos.redmi'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
