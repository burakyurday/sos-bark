name: SOS Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK archive, zip alignment and signatures
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -25
          sha256sum "$APK"
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: SOS-RedmiNote8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish direct mobile APK link to repository
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/SOS-RedmiNote8-v1.0.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SOS-RedmiNote8-v1.0.1.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: publish directly downloadable Android APK [skip ci]"
            git push origin HEAD:main
          fi

  emulator-install-test:
    name: Verify APK installation on Android 10 emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: SOS-RedmiNote8-APK
          path: apk
      - name: Enable hardware acceleration
        run: |
          sudo chmod 666 /dev/kvm || true
      - name: Boot Android 10 and install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell getprop ro.build.version.release
            adb install apk/app-debug.apk
            adb shell pm path com.mutfakajans.sos.redmi
            adb shell am start -n com.mutfakajans.sos.redmi/com.mutfakajans.sos.MainActivity
            sleep 3
            adb logcat -d -t 150 | grep -E "FATAL EXCEPTION|Process: com.mutfakajans.sos.redmi" && exit 1 || true
